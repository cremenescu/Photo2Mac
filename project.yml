name: Photo2Mac
options:
  bundleIdPrefix: ro.cremenescu
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.9.4"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.3.1"
    CURRENT_PROJECT_VERSION: "5"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    GENERATE_INFOPLIST_FILE: NO

schemes:
  Photo2Mac:
    build:
      targets:
        Photo2Mac: all
        Photo2MacTests: [test]
    test:
      targets:
        - Photo2MacTests

targets:
  Photo2Mac:
    type: application
    platform: macOS
    sources:
      - App
    resources:
      - App/Resources
    dependencies:
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ro.cremenescu.Photo2Mac
        PRODUCT_NAME: Photo2Mac
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Photo2Mac
        CFBundleDisplayName: Photo2Mac
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundlePackageType: APPL
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - ro
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.photography
        NSHumanReadableCopyright: "Copyright (c) 2026 Razvan Cremenescu. GPL-2.0-or-later."
        NSHighResolutionCapable: true
        CFBundleIconFile: AppIcon
        # Sparkle auto-update, as in mRemoteNXT. The feed (appcast) lives on
        # cremenescu.ro; the DMGs it points at are GitHub release assets.
        # SUPublicEDKey is the EdDSA public key shared with mRemoteNXT (the
        # private key lives only in the build machine's login keychain). One
        # check a day; an update is installed only after the user agrees, and
        # no system profile is ever sent.
        SUFeedURL: "https://cremenescu.ro/assets/photo2mac-appcast.xml"
        SUPublicEDKey: "H3Hm6zo4EVt4Dva4QV1/+HLK1c9ajCvl/pApbxsTAvU="
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUAutomaticallyUpdate: false
        SUEnableSystemProfiling: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Image
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.jpeg
              - public.png
              - public.heic
              - public.heif
              - public.tiff
              - org.webmproject.webp
              - public.avif

  Photo2MacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: Photo2Mac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ro.cremenescu.Photo2MacTests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Photo2Mac.app/Contents/MacOS/Photo2Mac
